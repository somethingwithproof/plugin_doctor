name: CI

on:
  workflow_call:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: doctor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['5.4', '5.6', '7.0', '7.1', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  unit-tests:
    name: Unit tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: composer test

  release-package:
    name: Release package contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate SemVer metadata
        run: tests/ci/AssertReleaseProcess.sh

      - name: Build and inspect installable archives
        run: |
          VERSION="$(php scripts/release.php version)"
          scripts/build-release.sh "v${VERSION}" dist
          tests/ci/AssertReleasePackage.sh "${VERSION}" dist

  shell-quality:
    name: Shell script quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run ShellCheck
        run: shellcheck -x scripts/*.sh tests/ci/*.sh

  cacti-integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Cacti 1.2.20 / PHP 5.4 / MariaDB / cmd.php
            cacti_ref: release/1.2.20
            php: '5.4'
            database_image: mariadb:10.5
            poller_type: '1'
            baseline_exit: '0'
            baseline_failures: ''
            rrdtool_status: pass
            package_install: true
          - name: Cacti 1.2.20 / PHP 7.0 / MySQL / cmd.php
            cacti_ref: release/1.2.20
            php: '7.0'
            database_image: mysql:5.7
            poller_type: '1'
            baseline_exit: '0'
            baseline_failures: ''
            rrdtool_status: pass
          - name: Cacti 1.2.20 / PHP 7.4 / MariaDB / Spine
            cacti_ref: release/1.2.20
            php: '7.4'
            database_image: mariadb:10.11
            poller_type: '2'
            baseline_exit: '0'
            baseline_failures: ''
            rrdtool_status: pass
          - name: Cacti 1.2.x / PHP 8.1 / MariaDB / cmd.php
            cacti_ref: 1.2.x
            php: '8.1'
            database_image: mariadb:10.11
            poller_type: '1'
            baseline_exit: '0'
            baseline_failures: ''
            rrdtool_status: pass
          - name: Cacti 1.2.x / PHP 8.4 / MySQL / Spine
            cacti_ref: 1.2.x
            php: '8.4'
            database_image: mysql:8.0
            poller_type: '2'
            baseline_exit: '0'
            baseline_failures: ''
            rrdtool_status: pass
          - name: Cacti develop / PHP 8.2 / MariaDB / cmd.php
            cacti_ref: develop
            php: '8.2'
            database_image: mariadb:10.11
            poller_type: '1'
            baseline_exit: '1'
            baseline_failures: binary.rrdtool
            rrdtool_status: fail
          - name: Cacti develop / PHP 8.4 / MySQL / Spine
            cacti_ref: develop
            php: '8.4'
            database_image: mysql:8.0
            poller_type: '2'
            baseline_exit: '1'
            baseline_failures: binary.rrdtool
            rrdtool_status: fail

    services:
      database:
        image: ${{ matrix.database_image }}
        env:
          MYSQL_ROOT_PASSWORD: cactiroot
          MYSQL_DATABASE: cacti
          MYSQL_USER: cactiuser
          MYSQL_PASSWORD: cactiuser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcactiroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Cacti/cacti
          ref: ${{ matrix.cacti_ref }}
          path: cacti

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: doctor-source

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, gd, gmp, intl, ldap, mbstring, openssl, pcntl, pdo_mysql, posix, sockets, xml, zlib
          ini-values: memory_limit=256M, max_execution_time=60, date.timezone=UTC

      - name: Install Doctor plugin payload
        env:
          PACKAGE_INSTALL: ${{ matrix.package_install }}
        run: |
          mkdir -p cacti/plugins
          if [ "$PACKAGE_INSTALL" = 'true' ]; then
            VERSION="$(php doctor-source/scripts/release.php version)"
            doctor-source/scripts/build-release.sh "v${VERSION}" "${RUNNER_TEMP}/doctor-dist"
            tar -xzf "${RUNNER_TEMP}/doctor-dist/doctor-${VERSION}.tar.gz" -C cacti/plugins
          else
            mkdir cacti/plugins/doctor
            git -C doctor-source archive HEAD | tar -x -C cacti/plugins/doctor
          fi
          test -f doctor-source/tests/ci/AssertDoctorReport.php

      - name: Install system prerequisites
        env:
          POLLER_TYPE: ${{ matrix.poller_type }}
        run: |
          sudo apt-get update
          sudo apt-get --fix-broken install -y
          PACKAGES=(default-mysql-client rrdtool snmp)
          if [ "$POLLER_TYPE" = '2' ]; then
            PACKAGES+=(cacti-spine)
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${PACKAGES[@]}"

      - name: Install Cacti Composer dependencies when required
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress
          fi
        working-directory: cacti

      - name: Configure Cacti database access
        run: |
          cp include/config.php.dist include/config.php
          sed -i "s/\$database_hostname[[:space:]]*= 'localhost'/\$database_hostname = '127.0.0.1'/" include/config.php
          mysql -h127.0.0.1 -uroot -pcactiroot -e "ALTER DATABASE cacti CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h127.0.0.1 -uroot -pcactiroot cacti < cacti.sql
          mysql -h127.0.0.1 -uroot -pcactiroot -e "INSERT INTO mysql.time_zone (Use_leap_seconds) VALUES ('N'); SET @doctor_timezone_id=LAST_INSERT_ID(); INSERT INTO mysql.time_zone_name (Name, Time_zone_id) VALUES ('Doctor/UTC', @doctor_timezone_id); GRANT SELECT ON mysql.time_zone_name TO 'cactiuser'@'%'; FLUSH PRIVILEGES;"
        working-directory: cacti

      - name: Configure diagnostic paths and poller
        env:
          POLLER_TYPE: ${{ matrix.poller_type }}
        run: |
          PHP_PATH="$(command -v php)"
          SPINE_PATH=''
          if [ "$POLLER_TYPE" = '2' ]; then
            SPINE_PATH="$(command -v spine)"
            "$SPINE_PATH" --version
          fi
          mkdir -p cache log rra
          touch log/cacti.log
          mysql -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "REPLACE INTO settings (name, value) VALUES ('path_php_binary', '${PHP_PATH}'), ('path_rrdtool', '/usr/bin/rrdtool'), ('path_snmpget', '/usr/bin/snmpget'), ('path_snmpwalk', '/usr/bin/snmpwalk'), ('path_spine', '${SPINE_PATH}'), ('path_cactilog', '${GITHUB_WORKSPACE}/cacti/log/cacti.log'), ('poller_type', '${POLLER_TYPE}'), ('poller_interval', '300'), ('poller_lastrun_1', UNIX_TIMESTAMP());"
        working-directory: cacti

      - name: Register and enable Doctor
        run: |
          if [ -f cli/plugin_manage.php ]; then
            php cli/plugin_manage.php --plugin=doctor --install --enable
          else
            php -r "chdir('${GITHUB_WORKSPACE}/cacti'); include './include/cli_check.php'; api_plugin_install('doctor'); api_plugin_enable('doctor');"
          fi
        working-directory: cacti

      - name: Verify plugin registration
        run: |
          HOOKS="$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_hooks WHERE name='doctor';")"
          REALMS="$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_realms WHERE plugin='doctor' AND file='doctor.php';")"
          ENABLED="$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_config WHERE directory='doctor' AND status=1;")"
          DISABLED_HOOKS="$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_hooks WHERE name='doctor' AND status<>1;")"
          test "$HOOKS" -eq 3
          test "$REALMS" -eq 1
          test "$ENABLED" -eq 1
          test "$DISABLED_HOOKS" -eq 0

      - name: Run and validate baseline Doctor report
        env:
          BASELINE_EXIT: ${{ matrix.baseline_exit }}
          BASELINE_FAILURES: ${{ matrix.baseline_failures }}
          RRDTOOL_STATUS: ${{ matrix.rrdtool_status }}
        run: |
          set +e
          php plugins/doctor/cli/doctor.php --json > doctor-baseline.json
          DOCTOR_EXIT=$?
          set -e
          test "$DOCTOR_EXIT" -eq "$BASELINE_EXIT"
          php ../doctor-source/tests/ci/AssertDoctorReport.php doctor-baseline.json \
            "--failures=${BASELINE_FAILURES}" \
            cacti.version=pass php.version=pass php.extensions=pass php.cli_extensions=pass \
            database.connection=pass database.version=pass database.charset=pass \
            database.timezone=pass database.core_tables=pass filesystem.runtime_directories=pass \
            binary.php_binary=pass "binary.rrdtool=${RRDTOOL_STATUS}" \
            binary.snmpget=pass binary.snmpwalk=pass poller.configuration=pass poller.freshness=pass
        working-directory: cacti

      - name: Verify controlled failures and recovery
        env:
          BASELINE_EXIT: ${{ matrix.baseline_exit }}
          BASELINE_FAILURES: ${{ matrix.baseline_failures }}
          RRDTOOL_STATUS: ${{ matrix.rrdtool_status }}
        run: |
          mysql -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "UPDATE settings SET value='/doctor/does-not-exist' WHERE name='path_snmpwalk'; UPDATE settings SET value=UNIX_TIMESTAMP() - 7200 WHERE name='poller_lastrun_1';"
          set +e
          php plugins/doctor/cli/doctor.php --json > doctor-negative.json
          DOCTOR_EXIT=$?
          set -e
          test "$DOCTOR_EXIT" -eq 1
          FAILURES='binary.snmpwalk,poller.freshness'
          if [ -n "$BASELINE_FAILURES" ]; then
            FAILURES="${BASELINE_FAILURES},${FAILURES}"
          fi
          php ../doctor-source/tests/ci/AssertDoctorReport.php doctor-negative.json \
            "--failures=${FAILURES}" binary.snmpwalk=fail poller.freshness=fail

          mysql -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "UPDATE settings SET value='/usr/bin/snmpwalk' WHERE name='path_snmpwalk'; UPDATE settings SET value=UNIX_TIMESTAMP() WHERE name='poller_lastrun_1';"
          set +e
          php plugins/doctor/cli/doctor.php --json > doctor-recovered.json
          DOCTOR_EXIT=$?
          set -e
          test "$DOCTOR_EXIT" -eq "$BASELINE_EXIT"
          php ../doctor-source/tests/ci/AssertDoctorReport.php doctor-recovered.json \
            "--failures=${BASELINE_FAILURES}" "binary.rrdtool=${RRDTOOL_STATUS}" \
            binary.snmpwalk=pass poller.freshness=pass
        working-directory: cacti

      - name: Verify repair confirmation and outcome
        run: |
          set +e
          php plugins/doctor/cli/doctor.php --repair=runtime_directories --json > doctor-unconfirmed-repair.json
          REPAIR_EXIT=$?
          set -e
          test "$REPAIR_EXIT" -eq 2

          chmod u-w cache
          set +e
          php plugins/doctor/cli/doctor.php --json > doctor-before-repair.json
          DOCTOR_EXIT=$?
          set -e
          test "$DOCTOR_EXIT" -eq 1
          php ../doctor-source/tests/ci/AssertDoctorReport.php doctor-before-repair.json filesystem.runtime_directories=fail

          php plugins/doctor/cli/doctor.php --repair=runtime_directories --yes --json > doctor-repair.json
          # shellcheck disable=SC2016
          php -r '$data=json_decode(file_get_contents("doctor-repair.json"), true); exit(is_array($data) && $data["id"] === "repair.runtime_directories" && $data["status"] === "pass" ? 0 : 1);'
          test -w cache
        working-directory: cacti

      - name: Verify disable, enable, uninstall, and reinstall lifecycle
        run: |
          if [ -f cli/plugin_manage.php ]; then
            php cli/plugin_manage.php --plugin=doctor --disable
          else
            php -r "chdir('${GITHUB_WORKSPACE}/cacti'); include './include/cli_check.php'; api_plugin_disable('doctor');"
          fi
          test "$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_config WHERE directory='doctor' AND status=1;")" -eq 0

          if [ -f cli/plugin_manage.php ]; then
            php cli/plugin_manage.php --plugin=doctor --enable
            php cli/plugin_manage.php --plugin=doctor --uninstall
          else
            php -r "chdir('${GITHUB_WORKSPACE}/cacti'); include './include/cli_check.php'; api_plugin_enable('doctor'); api_plugin_uninstall('doctor');"
          fi
          test "$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_config WHERE directory='doctor';")" -eq 0
          test "$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_hooks WHERE name='doctor';")" -eq 0
          test "$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_realms WHERE plugin='doctor';")" -eq 0

          if [ -f cli/plugin_manage.php ]; then
            php cli/plugin_manage.php --plugin=doctor --install --enable
          else
            php -r "chdir('${GITHUB_WORKSPACE}/cacti'); include './include/cli_check.php'; api_plugin_install('doctor'); api_plugin_enable('doctor');"
          fi
          test "$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_config WHERE directory='doctor' AND status=1;")" -eq 1
        working-directory: cacti

      - name: Upload diagnostic reports after failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: doctor-reports-${{ strategy.job-index }}
          path: cacti/doctor-*.json
          if-no-files-found: ignore
