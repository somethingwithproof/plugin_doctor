name: CI

on:
  push:
  pull_request:

jobs:
  runtime-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.4', '5.6', '7.0', '7.1', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  unit-tests:
    name: Unit tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Cacti/cacti
          ref: 1.2.x
          path: cacti

      - uses: actions/checkout@v4
        with:
          path: cacti/plugins/doctor

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --prefer-dist --no-progress
        working-directory: cacti

      - name: Run unit tests
        run: include/vendor/bin/pest plugins/doctor/tests
        working-directory: cacti

  cacti-integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Cacti 1.2.20 / PHP 5.4 / MariaDB / cmd.php
            cacti_ref: release/1.2.20
            php: '5.4'
            database_image: mariadb:10.5
            poller_type: '1'
          - name: Cacti 1.2.20 / PHP 7.0 / MySQL / cmd.php
            cacti_ref: release/1.2.20
            php: '7.0'
            database_image: mysql:5.7
            poller_type: '1'
          - name: Cacti 1.2.20 / PHP 7.4 / MariaDB / Spine
            cacti_ref: release/1.2.20
            php: '7.4'
            database_image: mariadb:10.11
            poller_type: '2'
          - name: Cacti 1.2.x / PHP 8.1 / MariaDB / cmd.php
            cacti_ref: 1.2.x
            php: '8.1'
            database_image: mariadb:10.11
            poller_type: '1'
          - name: Cacti 1.2.x / PHP 8.4 / MySQL / Spine
            cacti_ref: 1.2.x
            php: '8.4'
            database_image: mysql:8.0
            poller_type: '2'
          - name: Cacti develop / PHP 8.1 / MariaDB / cmd.php
            cacti_ref: develop
            php: '8.1'
            database_image: mariadb:10.11
            poller_type: '1'
          - name: Cacti develop / PHP 8.4 / MySQL / Spine
            cacti_ref: develop
            php: '8.4'
            database_image: mysql:8.0
            poller_type: '2'

    services:
      database:
        image: ${{ matrix.database_image }}
        env:
          MYSQL_ROOT_PASSWORD: cactiroot
          MYSQL_DATABASE: cacti
          MYSQL_USER: cactiuser
          MYSQL_PASSWORD: cactiuser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcactiroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Cacti/cacti
          ref: ${{ matrix.cacti_ref }}
          path: cacti

      - uses: actions/checkout@v4
        with:
          path: cacti/plugins/doctor

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, gd, gmp, intl, ldap, mbstring, openssl, pcntl, pdo_mysql, posix, sockets, xml, zlib
          ini-values: memory_limit=256M, max_execution_time=60, date.timezone=UTC

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client rrdtool snmp

      - name: Install Cacti Composer dependencies when required
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress
          fi
        working-directory: cacti

      - name: Configure Cacti database access
        run: |
          cp include/config.php.dist include/config.php
          sed -i "s/\$database_hostname[[:space:]]*= 'localhost'/\$database_hostname = '127.0.0.1'/" include/config.php
          mysql -h127.0.0.1 -uroot -pcactiroot cacti < cacti.sql
          mysql -h127.0.0.1 -uroot -pcactiroot -e "GRANT SELECT ON mysql.time_zone_name TO 'cactiuser'@'%'; FLUSH PRIVILEGES;"
        working-directory: cacti

      - name: Configure diagnostic paths and poller
        env:
          POLLER_TYPE: ${{ matrix.poller_type }}
        run: |
          PHP_PATH="$(command -v php)"
          mysql -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "REPLACE INTO settings (name, value) VALUES ('path_php_binary', '${PHP_PATH}'), ('path_rrdtool', '/usr/bin/rrdtool'), ('path_snmpget', '/usr/bin/snmpget'), ('path_snmpwalk', '/usr/bin/snmpwalk'), ('path_spine', '/usr/bin/true'), ('poller_type', '${POLLER_TYPE}'), ('poller_interval', '300'), ('poller_lastrun_1', UNIX_TIMESTAMP());"

      - name: Register and enable Doctor
        run: |
          if [ -f cli/plugin_manage.php ]; then
            php cli/plugin_manage.php --plugin=doctor --install --enable
          else
            php -r "chdir('${GITHUB_WORKSPACE}/cacti'); include './include/cli_check.php'; api_plugin_install('doctor'); api_plugin_enable('doctor');"
          fi
        working-directory: cacti

      - name: Verify plugin registration
        run: |
          HOOKS="$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_hooks WHERE name='doctor';")"
          REALMS="$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_realms WHERE plugin='doctor' AND file='doctor.php';")"
          ENABLED="$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_config WHERE directory='doctor' AND status=1;")"
          DISABLED_HOOKS="$(mysql -N -h127.0.0.1 -ucactiuser -pcactiuser cacti -e "SELECT COUNT(*) FROM plugin_hooks WHERE name='doctor' AND status<>1;")"
          test "$HOOKS" -eq 3
          test "$REALMS" -eq 1
          test "$ENABLED" -eq 1
          test "$DISABLED_HOOKS" -eq 0

      - name: Run Doctor CLI smoke test
        run: |
          set +e
          php plugins/doctor/cli/doctor.php --json > doctor-results.json
          DOCTOR_EXIT=$?
          set -e
          test "$DOCTOR_EXIT" -le 1
          # shellcheck disable=SC2016
          php -r '$data = json_decode(file_get_contents("doctor-results.json"), true); if (!is_array($data) || count($data["checks"]) < 20) { exit(1); } $ids = array(); foreach ($data["checks"] as $check) { $ids[] = $check["id"]; } foreach (array("php.version", "php.cli_extensions", "database.version", "database.timezone", "binary.rrdtool", "poller.freshness") as $required) { if (!in_array($required, $ids, true)) { exit(2); } }'
        working-directory: cacti

      - name: Confirm PHP prerequisite passes
        run: |
          # shellcheck disable=SC2016
          php -r '$data = json_decode(file_get_contents("doctor-results.json"), true); foreach ($data["checks"] as $check) { if ($check["id"] === "php.version") { echo $check["detail"], PHP_EOL; exit($check["status"] === "pass" ? 0 : 1); } } exit(2);'
        working-directory: cacti
