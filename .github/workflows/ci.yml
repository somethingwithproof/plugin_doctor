name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Cacti/cacti
          ref: 1.2.x
          path: cacti

      - uses: actions/checkout@v4
        with:
          path: cacti/plugins/doctor

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --prefer-dist --no-progress
        working-directory: cacti

      - name: Lint plugin PHP
        run: find plugins/doctor -name '*.php' -print0 | xargs -0 -n1 php -l
        working-directory: cacti

      - name: Run unit tests
        run: include/vendor/bin/pest plugins/doctor/tests
        working-directory: cacti
