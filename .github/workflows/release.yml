name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: doctor-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a merged release commit
        run: git merge-base --is-ancestor HEAD origin/develop
      - name: Build installable archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/build_release.py --tag "$RELEASE_TAG" --output dist
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          version = os.environ['RELEASE_TAG'][1:]
          text = pathlib.Path('CHANGELOG.md').read_text()
          section = text.split('## ' + version + ' - ', 1)[1]
          notes = section.split('\n', 1)[1].split('\n## ', 1)[0].strip()
          pathlib.Path('release-notes.txt').write_text(notes + '\n')
          PY
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace a published release"'
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
              --title "Doctor $RELEASE_TAG" --notes-file release-notes.txt "${flags[@]}"
          fi
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --notes-file release-notes.txt \
            --target "$GITHUB_SHA" --prerelease="$prerelease" --draft=false
