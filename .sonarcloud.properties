# Cacti code style conflicts with these generic PHP rules: Cacti indents with
# tabs, keeps the opening brace on the function line, has no line-length limit,
# and calls plugin hooks such as plugin_doctor_install() by snake_case name.
sonar.issue.ignore.multicriteria=lineLength,braces,functionNames,tabs

sonar.issue.ignore.multicriteria.lineLength.ruleKey=php:S103
sonar.issue.ignore.multicriteria.lineLength.resourceKey=**/*.php

sonar.issue.ignore.multicriteria.braces.ruleKey=php:S1808
sonar.issue.ignore.multicriteria.braces.resourceKey=**/*.php

sonar.issue.ignore.multicriteria.functionNames.ruleKey=php:S100
sonar.issue.ignore.multicriteria.functionNames.resourceKey=**/*.php

sonar.issue.ignore.multicriteria.tabs.ruleKey=php:S105
sonar.issue.ignore.multicriteria.tabs.resourceKey=**/*.php
